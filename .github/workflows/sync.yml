name: sync versions

on:
  schedule:
    # UTC 21:00 = 北京时间 05:00
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-versions
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync versions from npm
        run: node sync.mjs
      - name: Validate index
        run: >-
          node validate.mjs
          --url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/index.json"
      - name: Commit changes
        run: |
          if git diff --quiet -- index.json; then
            echo "没有版本变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "chore: sync plugin versions"
          git push
